name: Vidéo du jour

on:
  schedule:
    # E-mail à 10h00 (heure de Paris). GitHub retarde souvent (parfois de plusieurs heures) ou saute les
    # déclenchements planifiés : on démarre tôt, sur plusieurs créneaux (heures UTC, été comme hiver).
    # Le premier qui passe génère la vidéo puis attend 10h00 ; les suivants voient que c'est fait et s'arrêtent.
    - cron: "5 6 * * *"
    - cron: "35 6 * * *"
    - cron: "5 7 * * *"
    - cron: "35 7 * * *"
    - cron: "5 8 * * *"
    - cron: "35 8 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier sur les réseaux (sinon : génération seule)"
        type: boolean
        default: true
      now:
        description: "Publier tout de suite (sinon : attendre 10h00 heure de Paris)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-video

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier l'heure de Paris et éviter les doublons
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Europe/Paris date +%F)
          HOUR=$(TZ=Europe/Paris date +%H)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if grep -q "^$TODAY" published.log 2>/dev/null || gh release view "$TODAY" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Déjà publié aujourd'hui"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$HOUR" -lt 7 ] || [ "$HOUR" -ge 15 ]; }; then
            echo "Mauvais créneau horaire ($HOUR h à Paris)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Générer la vidéo
        if: steps.gate.outputs.go == 'true'
        run: python daily.py --date ${{ steps.gate.outputs.today }}

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true'
        with:
          name: video-${{ steps.gate.outputs.today }}
          path: out/${{ steps.gate.outputs.today }}
          retention-days: 14

      - name: Attendre 10h00 (heure de Paris)
        if: steps.gate.outputs.go == 'true' && !inputs.now
        run: |
          NOW=$(date +%s); TARGET=$(TZ=Europe/Paris date -d "today 10:00" +%s)
          if [ "$TARGET" -gt "$NOW" ]; then echo "Attente $((TARGET-NOW)) s"; sleep $((TARGET-NOW)); fi

      - name: Publier
        if: steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python publish.py out/${{ steps.gate.outputs.today }}

      - name: Release du jour (e-mail automatique avec vidéo + texte à copier)
        if: steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=out/${{ steps.gate.outputs.today }}
          python - "$D" <<'PY'
          import json, sys
          d = sys.argv[1]; m = json.load(open(f"{d}/meta.json"))
          open(f"{d}/notes.md", "w").write(
              "### 📱 Texte à copier pour TikTok / Instagram\n\n```\n" + m["caption"] + "\n```\n\n"
              "### ▶️ Titre YouTube Shorts\n\n```\n" + m["youtube_title"] + "\n```\n\n"
              "Vidéo et couverture : fichiers `video.mp4` et `cover.jpg` ci-dessous.\n")
          PY
          gh release create "${{ steps.gate.outputs.today }}" "$D/video.mp4" "$D/cover.jpg" \
            --title "🎬 ${{ steps.gate.outputs.today }} — $(python -c "import json;print(json.load(open('$D/meta.json'))['title'])")" \
            --notes-file "$D/notes.md"

      - name: Journal (garde aussi le dépôt actif)
        if: steps.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          python -c "import json;m=json.load(open('out/${{ steps.gate.outputs.today }}/meta.json'));print(m['date'],m['template'],m['options'],m['title'],sep=' | ')" >> published.log
          git config user.name "daily-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published.log && git commit -m "Vidéo du ${{ steps.gate.outputs.today }}"
          git pull --rebase -q origin main && git push
